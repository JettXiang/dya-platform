<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>抖音AI合集作者采集</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>AI 合集作者采集</h1>
      <p class="sub">挂载合集 + 作者声明「内容由AI生成」</p>
    </header>

    <section class="cards">
      <div class="card">
        <b id="count">0</b>
        <span>本轮作者</span>
      </div>
      <div class="card">
        <b id="scanned">0</b>
        <span>已扫视频</span>
      </div>
    </section>
    <p class="status">状态：<strong id="collecting">未开始</strong></p>
    <div class="daystart">
      <div class="daystart-main">
        <span class="daystart-k">当日起点</span>
        <strong id="dayStartText">-</strong>
        <button class="mini" data-act="end-today" title="重置起点 + 清空列表 + 停止采集">结束今天</button>
      </div>
      <div class="daystart-last">
        <button class="daystart-toggle" data-act="hist-toggle" aria-expanded="false" title="查看当日重置历史">▸</button>
        <span id="dayStartLast">上一次重置：—</span>
      </div>
      <div class="daystart-hist" id="dayStartHist" hidden></div>
    </div>

    <section class="actions">
      <button class="primary" data-act="toggle" id="toggle">开始采集</button>
      <button data-act="auto" id="auto">自动下滑</button>
      <button data-act="open">打开精选页</button>
      <button data-act="backend">打开后台</button>
      <button data-act="guard">故障记录</button>
    </section>

    <section class="filters">
      <label><input type="checkbox" id="requireMix" checked /> 必须挂载合集</label>
      <label><input type="checkbox" id="requireAi" checked /> 必须「内容由AI生成」</label>
      <label class="interval">自动间隔
        <select id="intervalMs">
          <option value="4000" selected>4 秒</option>
          <option value="6000">6 秒</option>
          <option value="8000">8 秒</option>
        </select>
      </label>
      <label><input type="checkbox" id="autoSwitchChannel" /> 自动换栏目</label>
      <label><input type="checkbox" id="autoSwitchSearch" /> 自动换搜索词</label>
    </section>

    <section class="filters">
      <label><input type="checkbox" id="refreshEnabled" /> 随机刷新（仅采集页生效）</label>
      <label class="rf-range">刷新区间
        <input type="number" id="refreshMinSec" min="30" max="3600" step="10" value="180" />
        <span>秒 ~</span>
        <input type="number" id="refreshMaxSec" min="30" max="3600" step="10" value="480" />
        <span>秒</span>
      </label>
      <div class="rf-actions">
        <button data-act="refresh-start" id="refreshStart">开始计时</button>
        <button data-act="refresh-now">立即刷新一次</button>
      </div>
      <p class="rf-status" id="refreshText">随机刷新：未启用</p>
      <p class="rf-msg" id="rfMsg" role="status" aria-live="polite"></p>
    </section>

    <section class="filters" id="platformBox">
      <label><input type="checkbox" id="pEnabled" /> 平台上报（本地）</label>
      <div class="rf-actions">
        <input id="pCode" maxlength="8" placeholder="工号" style="width:72px" autocomplete="off" />
        <input id="pPass" type="password" placeholder="密码" style="width:96px" autocomplete="off" />
        <input id="pAccount" maxlength="32" placeholder="账号编码(如 X-A1)" style="width:110px" autocomplete="off" />
        <button class="mini" id="pLogin">登录</button>
        <button class="mini" id="pFlush">立即上报</button>
        <button class="mini" id="pFinal">补发终片</button>
        <button class="mini" id="pDay">日终</button>
        <button class="mini" id="pRetry">重试失败</button>
        <button class="mini" id="pVoid">作废run</button>
        <button class="mini" id="pDefer">暂缓</button>
        <button class="mini" id="pExport">导出失败</button>
      </div>
      <p class="rf-status" id="pState">未登录</p>
      <p class="rf-msg" id="pMsg" role="status" aria-live="polite"></p>
    </section>

    <section class="export">
      <button data-act="copy">复制 sec_uid</button>
      <button data-act="txt">导出 TXT</button>
      <button data-act="csv">导出 CSV</button>
      <button data-act="json">导出 JSON</button>
      <button data-act="plog">导出时段样本</button>
      <button class="danger" data-act="clear" title="只清空列表，不改当日起点；日常收工请用「结束今天」">仅清空列表</button>
    </section>

    <section id="picker" class="picker" hidden>
      <div class="picker-head">
        <strong>选择导出范围</strong>
        <button class="mini" id="picker-close">关闭</button>
      </div>

      <label class="pk-label" for="uploaderId">上传人 ID</label>
      <input id="uploaderId" maxlength="64" placeholder="请输入上传人 ID" autocomplete="off" spellcheck="false" />

      <span class="pk-label">日期</span>
      <div class="pk-row" id="pkRange">
        <button data-range="today" class="on">今天</button>
        <button data-range="7d">近 7 天</button>
        <button data-range="30d">一个月内</button>
        <button data-range="all">全部</button>
      </div>

      <div id="pkSlotWrap">
        <span class="pk-label">时段（今天内）</span>
        <div class="pk-row" id="pkSlot">
          <button data-slot="none" class="on">不限</button>
          <button data-slot="1h">近 1 小时</button>
          <button data-slot="3h">近 3 小时</button>
          <button data-slot="work">9:30–18:00</button>
          <button data-slot="custom">自定义</button>
        </div>
        <p class="pk-tip">「不限」= 当日起点 → 此刻；自定义精确到分钟，只筛今天内。</p>
        <div class="pk-custom" id="pkCustom" hidden>
          <select class="pk-time" id="pkFromH"></select><span>:</span><select class="pk-time" id="pkFromM"></select>
          <span class="pk-tilde">~</span>
          <select class="pk-time" id="pkToH"></select><span>:</span><select class="pk-time" id="pkToM"></select>
        </div>
      </div>

      <p class="pk-preview">命中 <strong id="pkCount">0</strong> 条</p>

      <div class="pk-gap" id="pkGap" hidden>
        <p id="pkGapText"></p>
        <div class="pk-row">
          <button data-gap="all">一起上传（含全部）</button>
          <button data-gap="cur">只传当前范围</button>
          <button data-gap="cancel">取消</button>
        </div>
      </div>

      <div class="pk-row pk-actions">
        <button data-do="copy" class="on">复制 ID</button>
        <button data-do="txt">另存为 TXT</button>
        <button data-do="csv">CSV</button>
        <button data-do="json">JSON</button>
      </div>
      <button class="primary pk-upload" data-do="upload">上传到 43.165.183.142</button>
      <p id="pkMsg" class="pk-msg" role="status" aria-live="polite"></p>
    </section>

    <div id="list" class="list"></div>
    <script src="../shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
