<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>故障记录 · 抖音AI合集作者采集</title>
<style>
  :root { --accent:#fe2c55; --bg:#f6f7f9; --card:#fff; --line:#e6e8eb; --text:#1d2129; --sub:#86909c; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 24px 60px; background:var(--bg); color:var(--text);
         font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  header p.sub { margin:0 0 18px; color:var(--sub); font-size:12px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  section h2 { font-size:14px; margin:0 0 12px; }
  .state { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .badge { padding:3px 10px; border-radius:999px; font-size:13px; font-weight:600; background:#f2f3f5; color:#4e5969; }
  .s-normal { background:#e8f7ee; color:#157f3d; }
  .s-observe { background:#fff7e8; color:#a86b00; }
  .s-backoff { background:#fff1e8; color:#c25b00; }
  .s-manual { background:#fdecef; color:#c0223f; }
  .meta { color:var(--sub); font-size:12px; }
  .kpis { display:flex; gap:26px; flex-wrap:wrap; margin-bottom:16px; }
  .kpi b { font-size:22px; }
  .kpi span { color:var(--sub); font-size:12px; margin-left:4px; }
  .chip { display:inline-block; padding:1px 7px; border-radius:4px; background:#f2f3f5; font-size:11.5px; margin-right:6px; color:#4e5969; }
  .bar { height:14px; background:linear-gradient(90deg,#ff7a9c,#fe2c55); border-radius:4px; }
  .timeline { list-style:none; margin:0 0 10px; padding:0; }
  .timeline li { position:relative; padding:0 0 12px 20px; border-left:2px solid var(--line); }
  .timeline li:last-child { border-left-color:transparent; padding-bottom:0; }
  .timeline li::before { content:""; position:absolute; left:-6px; top:5px; width:10px; height:10px; border-radius:50%; background:var(--accent); }
  details.ev { border:1px solid var(--line); border-radius:8px; padding:9px 12px; margin-bottom:8px; }
  details.ev > summary { cursor:pointer; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  details.ev > summary::before { content:"▸ "; color:var(--sub); }
  details.ev[open] > summary::before { content:"▾ "; }
  pre { background:#0f1115; color:#d5d9e0; padding:12px; border-radius:8px; overflow:auto; max-height:320px;
        font:12px/1.5 Consolas,Monaco,monospace; margin:0; }
  .row1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .url { word-break:break-all; margin-top:4px; }
  button { font:inherit; padding:7px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.mini { padding:2px 10px; font-size:12px; border-radius:6px; }
  button.mini:disabled { opacity:.5; cursor:default; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:16px; }
  .empty { color:var(--sub); font-size:13px; padding:8px 0; }
</style>
</head>
<body>
<header>
  <h1>故障记录</h1>
  <p class="sub">数据来自 chrome.storage.local 的 guardState / guardIndex / guardEvent:* · 支持单条「结案」</p>
</header>

<div class="toolbar">
  <button id="refresh">刷新</button>
  <button id="export">导出 JSON</button>
  <span class="meta" id="readAt"></span>
</div>

<section>
  <h2>当前守卫状态</h2>
  <div class="state" id="stateBox"></div>
</section>

<section>
  <h2>概览</h2>
  <div class="kpis" id="kpis"></div>
  <div id="daily"></div>
</section>

<section>
  <h2>事件列表（按时间倒序，点击展开详情）</h2>
  <div id="events"></div>
</section>

<script src="guard.js"></script>
</body>
</html>
